[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "identity-transfer-audit"
version = "0.2.0"
description = "Independent research audit for prediction transfer versus ranking transfer"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
identity-audit = "transferlab.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["transferlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
